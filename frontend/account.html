<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account · CrowdMind</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/features.css"><script src="/config.js"></script><script type="module" src="/account.js"></script></head><body><header class="site-header"><a class="wordmark" href="/index.html"><span class="mini-logo">CM</span>CrowdMind</a><a href="/ideas.html">Ideas</a></header><main><section class="auth-card"><div class="card-heading"><div class="logo">CM</div><h1 id="page-title">Your account</h1><p id="account-subtitle">Checking your session…</p></div><p id="account-message" class="form-message fields" role="status"></p><form id="profile-form" class="profile-edit" hidden><p>Role: <strong id="account-role"></strong></p><div class="field"><label>Full name<input name="fullName" required maxlength="100" autocomplete="name"></label></div><div class="field"><label>Email<input name="email" required type="email" autocomplete="email"></label></div><div class="field"><label>New password (optional)<input name="password" type="password" minlength="8" autocomplete="new-password"></label><p class="input-hint">Changing your password signs out all sessions.</p></div><div class="field"><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password"></label></div><button class="submit">Save profile</button></form><div class="form-bottom"><p><a href="/ideas.html">Explore ideas</a> <a id="manage-users" href="/admin.html" hidden>Manage users</a></p><button class="secondary danger" id="delete-account" hidden>Delete my account</button><button class="submit" id="logout" type="button">Sign out</button></div></section></main></body></html>
