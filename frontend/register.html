<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f5ff"><title>Create an account · CrowdMind</title><link rel="stylesheet" href="/styles.css"><script src="/auth-ui.js" defer></script></head>
<body>
<header class="site-header"><a class="wordmark" href="/login.html" aria-label="CrowdMind home"><span class="mini-logo">CM</span><span>CrowdMind</span></a><span class="header-note">Ideas grow together.</span></header>
<main><section class="auth-card" aria-labelledby="page-title">
<div class="card-heading"><a class="logo" href="/login.html" aria-label="CrowdMind">CM</a><h1 id="page-title">Join CrowdMind</h1><p>Create your account and start collaborating</p></div>
<form id="auth-form" data-mode="register" novalidate>
<div class="fields">
<div class="field"><label for="name">Full name</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><input id="name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required  aria-describedby="name-error"></div><p class="field-error" id="name-error"></p></div>
<div class="field"><label for="email">Email address</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg><input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required  aria-describedby="email-error"></div><p class="field-error" id="email-error"></p></div>
<div class="field"><label for="password">Password</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" placeholder="Create a strong password" autocomplete="new-password" required minlength="8" aria-describedby="password-error"><button class="reveal" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p class="field-error" id="password-error"></p></div>
<p class="input-hint">Use at least 8 characters.</p><div class="field"><label for="confirm-password">Confirm password</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="confirm-password" name="confirm-password" type="password" placeholder="Confirm your password" autocomplete="new-password" required minlength="8" aria-describedby="confirm-password-error"><button class="reveal" type="button" aria-label="Show confirm password" aria-controls="confirm-password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p class="field-error" id="confirm-password-error"></p></div>
<div class="consent"><label class="check-label"><input type="checkbox" id="terms" name="terms" aria-describedby="terms-error"><span>I agree to the <button type="button" class="text-link" data-dialog="terms">Terms of Service</button> and <button type="button" class="text-link" data-dialog="privacy">Privacy Policy</button></span></label><p class="field-error" id="terms-error"></p></div>
</div>
<div class="form-bottom"><button class="submit" type="submit">Create Account <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button><p class="form-message" id="form-message" role="status" aria-live="polite" tabindex="-1"></p><p class="switch-page">Already have an account? <a href="/login.html">Sign in</a></p></div>
</form>
</section><p class="preview-note"><span></span>UI preview · No account will be created.</p></main>
<footer class="site-footer"><span>© 2026 CrowdMind</span><span>Built for brighter ideas.</span></footer>
<dialog id="info-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" aria-label="Close dialog">×</button></div><p id="dialog-copy"></p><button type="button" class="submit dialog-done" id="dialog-done">Got it</button></dialog>
</body></html>
